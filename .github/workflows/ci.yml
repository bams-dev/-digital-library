name: CI - Digital Library

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (Node.js services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Books dependencies
        working-directory: books-service
        run: npm install

      - name: Install Users dependencies
        working-directory: users-service
        run: npm install

      - name: Install Loans dependencies
        working-directory: loans-service
        run: npm install

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React app (CI safe)
        working-directory: frontend
        run: CI=false npm run build