version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  users:
    build: ./users-service
    container_name: users_service
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./users-service/.env
    ports:
      - "5002:5002"

  loans:
    build: ./loans-service
    container_name: loans_service
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./loans-service/.env
    ports:
      - "5003:5003"

volumes:
  postgres_data: